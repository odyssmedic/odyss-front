services:
  - type: web
    name: odyss-front
    runtime: static
    repo: https://github.com/odyssmedic/odyss-front
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_PASSWORD_RECOVERY_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://odyss-back.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /api/*
        name: Cache-Control
        value: no-store
